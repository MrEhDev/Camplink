# Aquí configuro el flujo automatizado de CI/CD con GitHub Actions para validar
# pruebas de backend y compilación de frontend, y desplegar automáticamente en Render / DigitalOcean.

name: CI/CD Camplink Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Pruebas y Validación de Django Backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar migraciones y pruebas unitarias de Django
        run: |
          cd backend
          python manage.py migrate
          python manage.py test

  build-frontend:
    name: Compilación de React SPA Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar paquetes y compilar bundle con Vite
        run: |
          cd frontend
          npm install
          npm run build

  deploy:
    name: Despliegue Automático en Render / DigitalOcean
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en Render mediante Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Disparando webhook de despliegue en Render..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Variable RENDER_DEPLOY_HOOK_URL no configurada; omitiendo webhook."
          fi