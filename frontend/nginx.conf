# Aquí configuro el servidor Nginx para servir la SPA de Camplink y hacer proxy inverso al backend
server {
    listen 80;
    server_name camplinkapp.com www.camplinkapp.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para máxima velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Tamaño máximo de subida de archivos (fotos de perfil, vehículos y lugares)
    client_max_body_size 25M;

    # Rutas de la SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para la API REST de Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso para archivos multimedia (fotos de furgos, avatares, fotos de lugares)
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso para archivos estáticos del panel de administración (WhiteNoise/Django)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso para el panel de administración seguro
    location /panel-camplink-gestion/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de SEO directas servidas desde Django
    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
    }
}
